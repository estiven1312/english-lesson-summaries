name: Publish English library

on:
  push:
    branches: [main]
    paths:
      - 'content/Obsidian English/**'
      - 'content/PDFs/**'
      - 'scripts/**'
      - 'config/site.toml'
      - 'config/job.toml'
      - 'config/skills/**'
      - 'requirements-site.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# This workflow never commits, pushes, or calls an AI provider.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out your committed content
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - name: Install website and PDF tools
        run: |
          python -m pip install -r requirements-site.txt
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils
      - name: Run behavior tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build website and smaller PDF downloads
        run: python scripts/build_site.py
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
